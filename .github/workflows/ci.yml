name: Continuous integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-integration:
    name: Quality and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://agapay:agapay@localhost:5432/agapay_test?schema=public
      TEST_DATABASE_URL: postgresql://agapay:agapay@localhost:5432/agapay_test?schema=public
      AUTH_SECRET: ci-only-placeholder-not-used-outside-build-checks

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agapay_test
          POSTGRES_USER: agapay
          POSTGRES_PASSWORD: agapay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agapay -d agapay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Apply test database migrations
        run: npm run db:deploy

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

  end-to-end:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-placeholder-not-used-outside-browser-checks

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e
