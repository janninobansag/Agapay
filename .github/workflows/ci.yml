name: Continuous integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://agapay:agapay@localhost:5432/agapay?schema=public
      AUTH_SECRET: ci-only-placeholder-not-used-outside-build-checks

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
