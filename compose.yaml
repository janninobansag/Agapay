services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agapay
      POSTGRES_USER: agapay
      POSTGRES_PASSWORD: agapay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agapay -d agapay"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - agapay_postgres_data:/var/lib/postgresql/data

volumes:
  agapay_postgres_data:

